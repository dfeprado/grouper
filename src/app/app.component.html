<ul>
  @for (player of players(); track player) {
  <li>{{ player }}</li>
  }
</ul>
<button type="button" (click)="addPlayers()">Adicionar</button>
<grp-popup>
  <p>Escreva os nomes dos novos jogadores, cada um em uma linha.</p>
  <textarea
    class="w-full"
    style="min-height: 250px"
    autofocus="true"
  ></textarea>
  <button type="button">Adicionar</button>
</grp-popup>
